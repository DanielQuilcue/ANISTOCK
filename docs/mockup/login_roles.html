<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "secondary-fixed-dim": "#93ccff", "surface-container-highest": "#d3e4fe", "primary-fixed-dim": "#68dba9", "on-tertiary-fixed-variant": "#653e00", "surface-tint": "#006c4a", "surface-container-low": "#eff4ff", "on-tertiary-container": "#fffbff", "inverse-surface": "#213145", "on-surface-variant": "#3d4a42", "outline": "#6d7a72", "tertiary": "#825100", "tertiary-container": "#a36700", "primary-fixed": "#85f8c4", "tertiary-fixed": "#ffddb8", "on-primary-fixed-variant": "#005137", "tertiary-fixed-dim": "#ffb95f", "secondary-container": "#5bb8fe", "error": "#ba1a1a", "on-secondary": "#ffffff", "on-secondary-fixed-variant": "#004b73", "on-secondary-container": "#00476e", "background": "#f8f9ff", "surface-container-lowest": "#ffffff", "surface": "#f8f9ff", "primary": "#006948", "on-surface": "#0b1c30", "on-error-container": "#93000a", "on-primary": "#ffffff", "on-tertiary-fixed": "#2a1700", "inverse-on-surface": "#eaf1ff", "secondary-fixed": "#cce5ff", "surface-dim": "#cbdbf5", "surface-variant": "#d3e4fe", "on-error": "#ffffff", "on-primary-fixed": "#002114", "on-secondary-fixed": "#001d31", "surface-bright": "#f8f9ff", "surface-container-high": "#dce9ff", "on-primary-container": "#f5fff7", "on-background": "#0b1c30", "error-container": "#ffdad6", "on-tertiary": "#ffffff", "primary-container": "#00855d", "surface-container": "#e5eeff", "outline-variant": "#bccac0", "inverse-primary": "#68dba9", "secondary": "#006398" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "gutter": "1rem", "space-xl": "1.75rem", "space-lg": "1.25rem", "margin": "1.25rem", "space-md": "0.75rem", "space-xs": "0.25rem", "margin-mobile": "1rem", "gutter-mobile": "0.75rem", "space-sm": "0.5rem" }, fontFamily: { "headline-lg-mobile": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "tabular-numeric": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] }, fontSize: { "headline-lg-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "700" }], "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "tabular-numeric": ["16px", { "lineHeight": "20px", "fontWeight": "600" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-xl-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-lg": ["15px", { "lineHeight": "20px", "fontWeight": "600" }], "headline-xl": ["36px", { "lineHeight": "44px", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "700" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased"><main class="min-h-screen w-full bg-surface pt-safe pb-safe flex flex-col"><div class="flex flex-col w-full px-margin-mobile pb-8">
<div class="relative overflow-hidden rounded-xl bg-surface-container-low p-6 mb-5 shadow-sm">
<div class="absolute -top-12 -right-12 w-36 h-36 rounded-full bg-primary/10 blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-10 -left-10 w-32 h-32 rounded-full bg-secondary/10 blur-xl pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center text-center">
<div class="w-20 h-20 rounded-xl bg-surface-container-lowest p-2 shadow-sm mb-3 flex items-center justify-center">
<img alt="Logo Suministros y Servicios" class="w-full h-full object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/AEtjO1VHbIrgrXzsKqp5mKpzdpnKAFhJybtsQkU2aqRLXIFyHFzucHULXp5aZazrJul5J9bGYHTkvu32PhKnHE0JF8npL-uyc3D2oVKl-9XtKhumcVfp3958O_5WIiJ-eLbjpCSB6cIvVQBIjSml52iHnaDYD5uc3IOPeOLXcujOPTajmOsObCyJt4wV1cMI43m9_rSclag9qy4tgu1HaNn4cM4xXOMznkLEVa7-H1gLaiDGhA5nRmrPVP8Giape"/>
</div>
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-primary-fixed text-on-primary-fixed-variant font-label-sm text-label-sm uppercase tracking-wider mb-2">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
        Acceso Seguro
      </span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Gestión Operativa</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 max-w-xs">Control de Suministros, Aseo y Cafetería</p>
</div>
</div>
<section class="mb-5">
<div class="flex items-center justify-between mb-2.5 px-1">
<h2 class="font-label-lg text-label-lg text-on-surface">Selecciona tu perfil</h2>
<span class="font-body-sm text-body-sm text-primary flex items-center gap-1">
<span class="material-symbols-outlined text-[15px]">touch_app</span> Toca para cambiar
      </span>
</div>
<div aria-label="Selección de perfil" class="grid grid-cols-3 gap-2" id="role-selector" role="radiogroup">
<button class="role-card flex flex-col items-center justify-between p-3 rounded-xl bg-surface-container-lowest text-on-surface shadow-sm transition-all duration-200 active:scale-95 text-center min-h-[96px]" data-role="contratista" type="button">
<div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant transition-colors icon-wrapper">
<span class="material-symbols-outlined text-[20px]">badge</span>
</div>
<span class="font-label-md text-label-md mt-1 leading-tight text-title">Contratista</span>
<span class="font-body-sm text-[10px] text-on-surface-variant text-desc opacity-80">Servicios</span>
</button>
<button class="role-card active-role flex flex-col items-center justify-between p-3 rounded-xl bg-primary text-on-primary shadow-md transition-all duration-200 active:scale-95 text-center min-h-[96px]" data-role="supervisor" type="button">
<div class="w-9 h-9 rounded-full bg-surface-container-lowest/20 flex items-center justify-center text-on-primary transition-colors icon-wrapper">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">fact_check</span>
</div>
<span class="font-label-md text-label-md mt-1 leading-tight text-title font-semibold">Supervisor</span>
<span class="font-body-sm text-[10px] text-on-primary/80 text-desc">Aseo &amp; Café</span>
</button>
<button class="role-card flex flex-col items-center justify-between p-3 rounded-xl bg-surface-container-lowest text-on-surface shadow-sm transition-all duration-200 active:scale-95 text-center min-h-[96px]" data-role="encargado" type="button">
<div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant transition-colors icon-wrapper">
<span class="material-symbols-outlined text-[20px]">inventory_2</span>
</div>
<span class="font-label-md text-label-md mt-1 leading-tight text-title">Encargado</span>
<span class="font-body-sm text-[10px] text-on-surface-variant text-desc opacity-80">Pedidos</span>
</button>
</div>
</section>
<form class="bg-surface-container-lowest rounded-xl p-5 shadow-sm space-y-4" id="login-form" onsubmit="event.preventDefault(); handleLogin();">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1.5" for="email">Correo Electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">alternate_email</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-low text-on-surface rounded-lg font-body-md text-body-md focus:outline-none focus:bg-surface-container placeholder:text-outline/70 transition-all duration-150" id="email" placeholder="ejemplo@empresa.com" required="" type="email"/>
</div>
</div>
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<button class="font-body-sm text-body-sm text-primary hover:underline" onclick="alert('Enlace de recuperación enviado a tu administrador corporativo.');" type="button">¿Olvidaste tu contraseña?</button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">lock</span>
<input class="w-full h-12 pl-11 pr-11 bg-surface-container-low text-on-surface rounded-lg font-body-md text-body-md focus:outline-none focus:bg-surface-container placeholder:text-outline/70 transition-all duration-150" id="password" placeholder="••••••••••••" required="" type="password"/>
<button class="absolute right-3 w-8 h-8 flex items-center justify-center text-on-surface-variant active:scale-90 transition-transform" id="toggle-pwd-btn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full h-[52px] bg-primary text-on-primary rounded-lg font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-all duration-150" id="submit-btn" type="submit">
<span>Iniciar Sesión</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<div class="relative flex items-center py-2">
<div class="flex-grow h-px bg-surface-container-high"></div>
<span class="px-3 font-body-sm text-body-sm text-on-surface-variant bg-surface-container-lowest">o accede rápidamente</span>
<div class="flex-grow h-px bg-surface-container-high"></div>
</div>
<button class="w-full h-12 rounded-lg bg-surface-container-low text-on-surface font-label-md text-label-md flex items-center justify-center gap-2.5 active:bg-surface-container transition-colors shadow-sm" onclick="handleBiometricAuth()" type="button">
<span class="material-symbols-outlined text-primary text-[22px]" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
<span>Ingresar con Huella / Face ID</span>
</button>
</form>
<div class="mt-6 flex flex-col items-center gap-2 text-center text-on-surface-variant">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-body-sm font-body-sm">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span>Instalación: Sede Central Norte</span>
</div>
<span class="font-body-sm text-[11px] text-outline">Versión 2.4.0 • Enterprise Facilities © 2025</span>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const pwdIcon = document.getElementById('pwd-icon');
    if (!pwdInput || !pwdIcon) return;

    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      pwdIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      pwdIcon.textContent = 'visibility';
    }
  }

  const roleCards = document.querySelectorAll('.role-card');
  roleCards.forEach(card => {
    card.addEventListener('click', () => {
      roleCards.forEach(c => {
        c.classList.remove('active-role', 'bg-primary', 'text-on-primary', 'shadow-md');
        c.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
        
        const iconWrapper = c.querySelector('.icon-wrapper');
        const icon = c.querySelector('.material-symbols-outlined');
        const desc = c.querySelector('.text-desc');
        
        if (iconWrapper) {
          iconWrapper.className = 'w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant transition-colors icon-wrapper';
        }
        if (icon) {
          icon.style.fontVariationSettings = "'FILL' 0";
        }
        if (desc) {
          desc.className = 'font-body-sm text-[10px] text-on-surface-variant text-desc opacity-80';
        }
      });

      card.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
      card.classList.add('active-role', 'bg-primary', 'text-on-primary', 'shadow-md');
      
      const activeIconWrapper = card.querySelector('.icon-wrapper');
      const activeIcon = card.querySelector('.material-symbols-outlined');
      const activeDesc = card.querySelector('.text-desc');
      
      if (activeIconWrapper) {
        activeIconWrapper.className = 'w-9 h-9 rounded-full bg-surface-container-lowest/20 flex items-center justify-center text-on-primary transition-colors icon-wrapper';
      }
      if (activeIcon) {
        activeIcon.style.fontVariationSettings = "'FILL' 1";
      }
      if (activeDesc) {
        activeDesc.className = 'font-body-sm text-[10px] text-on-primary/80 text-desc';
      }
    });
  });

  function handleLogin() {
    const btn = document.getElementById('submit-btn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Validando...</span>';
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Sesión Iniciada</span>';
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }, 1500);
    }, 1000);
  }

  function handleBiometricAuth() {
    const feedback = document.createElement('div');
    feedback.className = 'fixed bottom-6 left-4 right-4 bg-inverse-surface text-inverse-on-surface p-4 rounded-xl shadow-lg flex items-center gap-3 z-50 transition-all';
    feedback.innerHTML = '<span class="material-symbols-outlined text-primary-fixed">fingerprint</span><span class="font-body-md text-body-md">Sensor biométrico activo. Autenticación exitosa.</span>';
    document.body.appendChild(feedback);
    setTimeout(() => {
      feedback.style.opacity = '0';
      setTimeout(() => feedback.remove(), 300);
    }, 2000);
  }
</script></main></body></html>
